# =====================================================================
# LK-TECH — configuration Nginx (VPS)
# À placer dans /etc/nginx/sites-available/linksmartec
# puis : ln -s /etc/nginx/sites-available/linksmartec /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name linksmartec.com www.linksmartec.com;

    # Redirection vers HTTPS (décommenter après avoir installé le certificat)
    # return 301 https://www.linksmartec.com$request_uri;

    client_max_body_size 8m;   # images téléversées depuis l'admin (4 Mo max)

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Les images et le logo changent rarement : mise en cache navigateur
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

